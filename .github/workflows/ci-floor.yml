name: CI floor

# Minimal independent check floor for every PR: shellcheck, this repo's own
# hermetic test suites, nixfmt --check, and an eval-only nix flake check.
# Runs alongside install-container-test.yml, not instead of it - that
# workflow covers the real Codespaces install path, this one is the cheap
# floor every PR gets regardless of which files it touches.
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck run.sh work/*.sh install.sh home/.local/bin/*

  # run.test.sh and install.test.sh are pure bash logic tests (host
  # selection, posture detection) with no macOS-only dependency - Ubuntu is
  # cheaper and sufficient. Both suites isolate HOME internally, but the
  # step also sets a scratch HOME itself: run.sh does an unconditional
  # `ln -sfn "$DIR" ~/.dotfiles` (see AGENTS.md and issue #9), so this job
  # must never rely on the runner being disposable to make that safe -
  # a scratch HOME here keeps the same workflow safe under `act` too.
  tests-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash run.test.sh
        run: HOME="$(mktemp -d)" bash run.test.sh
      - name: bash install.test.sh
        run: HOME="$(mktemp -d)" bash install.test.sh

  # work/bootstrap.sh and herdr-agent-handoff-marker only ever run on the
  # work Mac / personal Mac respectively (see AGENTS.md), and their
  # `#!/bin/sh` shebang resolves to a genuinely different shell on Linux
  # (dash) than on macOS (bash in POSIX mode) - macOS is the faithful
  # runner for these two even though every external command they touch is
  # mocked.
  tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: sh work/bootstrap.test.sh
        run: HOME="$(mktemp -d)" sh work/bootstrap.test.sh
      - name: sh herdr-agent-handoff-marker.test.sh
        run: HOME="$(mktemp -d)" sh home/.local/bin/herdr-agent-handoff-marker.test.sh

  # Eval-only: no build, no platform-specific output, so Ubuntu is fine
  # even though personal-mac is a darwinConfigurations output - see the
  # nix eval note in AGENTS.md.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: nixfmt --check
        run: nix shell nixpkgs#nixfmt --command nixfmt --check $(git ls-files '*.nix')
      - name: nix flake check (eval only)
        run: nix flake check --no-build --impure
