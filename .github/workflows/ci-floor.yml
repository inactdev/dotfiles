name: CI floor

# Minimal independent check floor for every PR: shellcheck, this repo's own
# hermetic test suites, nixfmt --check, and an eval-only `nix eval` per host.
# Runs alongside install-container-test.yml, not instead of it - that
# workflow covers the real Codespaces install path, this one is the cheap
# floor every PR gets regardless of which files it touches.
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck run.sh work/*.sh install.sh home/.local/bin/*

  # run.test.sh and install.test.sh are pure bash logic tests (host
  # selection, posture detection) with no macOS-only dependency - Ubuntu is
  # cheaper and sufficient. Both suites isolate HOME internally, but the
  # step also sets a scratch HOME itself as defense in depth: run.sh
  # historically repointed ~/.dotfiles unconditionally (issue #9, since
  # fixed by its link_dotfiles guard), so this job must never rely on the
  # runner being disposable - a scratch HOME keeps the same workflow safe
  # under `act` even if that guard ever regresses.
  tests-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash run.test.sh
        run: HOME="$(mktemp -d)" bash run.test.sh
      - name: bash install.test.sh
        run: HOME="$(mktemp -d)" bash install.test.sh

  # work/bootstrap.sh and herdr-agent-handoff-marker only ever run on the
  # work Mac / personal Mac respectively (see AGENTS.md), and their
  # `#!/bin/sh` shebang resolves to a genuinely different shell on Linux
  # (dash) than on macOS (bash in POSIX mode) - macOS is the faithful
  # runner for these two even though every external command they touch is
  # mocked.
  tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: sh work/bootstrap.test.sh
        run: HOME="$(mktemp -d)" sh work/bootstrap.test.sh
      - name: sh herdr-agent-handoff-marker.test.sh
        run: HOME="$(mktemp -d)" sh home/.local/bin/herdr-agent-handoff-marker.test.sh

  # Eval-only, one explicit `nix eval` per host rather than `nix flake
  # check`: darwinConfigurations/homeConfigurations aren't part of the
  # standard flake schema, so plain `nix flake check` doesn't look at them
  # at all, and only Determinate Nix's non-standard extended check does -
  # silently losing all eval coverage if the installer action is ever
  # swapped for upstream Nix. Forcing each host's toplevel/activationPackage
  # drvPath evaluates its full module closure without building it, listing
  # every host explicitly so none can be silently skipped - the same
  # pattern AGENTS.md documents for manual eval-only verification, and one
  # that upstream Nix supports identically to Determinate Nix.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: nixfmt --check
        run: git ls-files -z '*.nix' | xargs -0 nix shell nixpkgs#nixfmt --command nixfmt --check
      - name: nix eval darwinConfigurations.personal-mac (eval only)
        run: nix eval --impure --expr '(builtins.getFlake (toString ./.)).darwinConfigurations.personal-mac.config.system.build.toplevel.drvPath'
      - name: nix eval homeConfigurations.home-linux (eval only)
        run: nix eval --impure --expr '(builtins.getFlake (toString ./.)).homeConfigurations.home-linux.activationPackage.drvPath'
      - name: nix eval homeConfigurations.codespace-personal (eval only)
        run: nix eval --impure --expr '(builtins.getFlake (toString ./.)).homeConfigurations.codespace-personal.activationPackage.drvPath'
      - name: nix eval homeConfigurations.codespace-work (eval only)
        run: nix eval --impure --expr '(builtins.getFlake (toString ./.)).homeConfigurations.codespace-work.activationPackage.drvPath'
