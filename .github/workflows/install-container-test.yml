name: install.sh container rehearsal

# ubuntu-latest is a native x86_64 runner, matching real GitHub Codespaces
# machines exactly - no QEMU/platform emulation involved, unlike testing
# `--platform linux/amd64` locally on an Apple Silicon dev machine (where
# Nix's own build sandbox can't load its seccomp BPF program under
# emulation). See AGENTS.md and install.container-test.sh.
#
# Despite the name, this job is also the only place that runs a real
# home-manager activation of modules/fabrica.nix's and
# modules/inspector.nix's activation steps - the tail of
# install.container-test.sh switches flake.nix's
# homeConfigurations."ci-linux" in the same container, as its own
# throwaway user. The path filter below already covers it (modules/**,
# flake.nix, install.container-test.sh).
on:
  push:
    branches: [master]
    paths:
      - install.sh
      - install.container-test.sh
      - install.test.sh
      - flake.nix
      - flake.lock
      - modules/**
      - codespaces/**
      - home/.config/nvim/**
      - work/**
      - .github/workflows/install-container-test.yml
  pull_request:
    paths:
      - install.sh
      - install.container-test.sh
      - install.test.sh
      - flake.nix
      - flake.lock
      - modules/**
      - codespaces/**
      - home/.config/nvim/**
      - work/**
      - .github/workflows/install-container-test.yml
  workflow_dispatch: {}

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: bash install.test.sh
        run: bash install.test.sh
      - name: bash install.container-test.sh
        run: bash install.container-test.sh
